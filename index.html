  <style>

a6814}.add-special{margin-top:14px}.section{border-radius:18px;overflow:hidden;margin:12px 0;box-shadow:var(--shadow);background:var(--card)}.section.blue .section-head{background:var(--blue)}.section.peach .section-head{background:var(--peach)}.section.green .section-head{background:var(--green)}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 14px}.section-title{font-weight:900;font-size:14px}.section-count{font-size:12px;color:var(--muted);white-space:nowrap}.task{border-top:1px solid var(--line)}.easy-task{padding:10px 9px;display:grid;grid-template-columns:82px minmax(0,1fr) 38px 28px;gap:7px;align-items:center;min-height:64px}.task-main{min-width:0}.task-name{font-weight:800;font-size:14px;line-height:1.25}.task-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-note-preview{font-size:11px;color:#7c5b11;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-move-preview{font-size:11px;color:#5b6b82;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.is-done .task-name{text-decoration:line-through;color:#64748b}.status{border:none;border-radius:12px;padding:8px 7px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:5px;min-height:40px}.status-front{width:100%}.status-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}.status.todo{background:#fee2e2;color:#b91c1c}.status.waiting{background:#ffedd5;color:#9a3412}.status.done{background:#dcfce7;color:#166534}.icon-btn{border:0;background:#f3f4f6;border-radius:11px;width:36px;height:36px;display:grid;place-items:center;font-size:15px}.icon-btn.has-note{background:#fff7d6}.more{border:none;background:transparent;font-size:20px;color:#64748b;padding:6px 2px}.add-row{width:100%;border:0;border-top:1px solid var(--line);padding:12px;background:#fff;font-weight:900;color:var(--accent)}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px);z-index:20}.nav-btn{border:0;background:transparent;border-radius:13px;padding:8px 4px;color:#64748b;font-size:18px}.nav-btn span{display:block;font-size:11px;margin-top:3px}.nav-btn.active{background:#e8f1ff;color:#1d4ed8}.toolbar{display:flex;gap:8px;margin:8px 0 12px}.toolbar button{flex:1}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:4px}.day{min-height:70px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;position:relative;text-align:left}.day.selected{outline:2px solid #3b82f6}.day .num{font-weight:900}.day .marks{font-size:10px;margin-top:6px;line-height:1.35}.tdl-month>div{text-align:center}.tdl-overview{background:#13233a;color:#fff;border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}.tdl-progress-row{display:grid;grid-template-columns:75px 1fr;gap:12px;align-items:center}.tdl-progress-row>div:first-child strong{font-size:25px;display:block}.tdl-progress-row>div:first-child span{font-size:11px;opacity:.75}.progress{height:9px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:#4ade80}.stats.light .stat{background:rgba(255,255,255,.1)}.tdl-filter{display:flex;gap:8px;margin-top:12px}.filter-btn{flex:1;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:9px;font-size:12px;font-weight:800}.filter-btn.active{background:#fff;color:#172033}.tdl-section{background:#fff;border-radius:18px;overflow:hidden;margin:11px 0;box-shadow:var(--shadow)}.tdl-section-head{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:13px 14px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:13px}.tdl-section-head>div{display:flex;gap:7px;align-items:center}.tdl-section-head>span{font-size:11px;color:var(--muted)}.tdl-task{padding:10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:82px minmax(0,1fr) 38px;gap:8px;align-items:center}.tdl-task:last-child{border-bottom:0}.tdl-task-body{min-width:0}.tdl-task-body strong,.tdl-task-title strong{font-size:13px;line-height:1.25}.tdl-task-body small,.tdl-task-title small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.note-text{color:#8a6814!important}.recurring{display:block;padding:11px 10px}.tdl-task-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}.mini-status{font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px;white-space:nowrap}.mini-status.todo{background:#fee2e2;color:#b91c1c}.mini-status.waiting{background:#ffedd5;color:#9a3412}.mini-status.done{background:#dcfce7;color:#166534}.round-list{background:#f8fafc;border-radius:13px;padding:4px 8px}.round-row{display:grid;grid-template-columns:82px 1fr 36px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #dbe1e8}.round-row:last-child{border-bottom:0}.small-status{min-height:34px}.round-date{font-weight:800;font-size:12px}.settings-card{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:10px 0}.schedule{display:flex;gap:6px;flex-wrap:wrap}.schedule span{background:#eef2ff;color:#3730a3;padding:7px 9px;border-radius:999px;font-size:12px;font-weight:800}.primary{border:0;background:#2563eb;color:#fff;border-radius:13px;padding:11px 14px;font-weight:800}.big-btn{width:100%;padding:13px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.38);display:flex;align-items:flex-end;justify-content:center;z-index:50}.modal.hidden{display:none}.sheet{width:min(720px,100%);background:#fff;border-radius:22px 22px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));max-height:80dvh;overflow:auto}.sheet-handle{width:46px;height:5px;background:#d1d5db;border-radius:999px;margin:0 auto 14px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9dee7;border-radius:12px;padding:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}.danger{color:#b91c1c}.empty{padding:30px 16px;text-align:center;color:var(--muted)}.success-empty{background:#f0fdf4;border-radius:16px;color:#166534;font-weight:800}@media(max-width:380px){.easy-task,.tdl-task{grid-template-columns:76px minmax(0,1fr) 34px 24px}.tdl-task{grid-template-columns:76px minmax(0,1fr) 34px}.status{font-size:10px;padding:7px 5px}.section-title{font-size:13px}.task-name{font-size:13px}}@media(min-width:640px){.app-shell{padding-left:24px;padding-right:24px}.day{min-height:88px}}

/* V5: preserve V2 look, make frequent actions right-hand friendly */
.easy-task{grid-template-columns:minmax(0,1fr) 38px 88px 28px;gap:7px}
.tdl-task{grid-template-columns:minmax(0,1fr) 38px 88px 28px;gap:7px}
.status-front{min-width:82px;min-height:42px;padding:8px 8px}
.add-section-btn{width:100%;border:1px dashed #c8d2df;background:rgba(255,255,255,.84);border-radius:16px;padding:13px;margin:13px 0 4px;color:#2563eb;font-weight:900;box-shadow:0 4px 16px rgba(23,34,53,.04)}
.hint-card{background:#fff7d6;border:1px solid #f4df8d;color:#7c5b11;padding:11px 12px;border-radius:13px;font-size:12px;margin:10px 0}
button:disabled,input:disabled{opacity:.55;cursor:not-allowed}

/* TDL: V2 card shape + subtle pastel section identity */
.tdl-section-head{padding:12px 12px 12px 14px;border-bottom:1px solid var(--line)}
.tdl-head-title{display:flex;gap:8px;align-items:center;min-width:0}
.tdl-head-title strong{font-size:14px;line-height:1.3}
.tdl-head-actions{display:flex;align-items:center;gap:7px;flex:none}
.tdl-head-actions>span{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap}
.collapse-btn{width:38px;height:38px;border:1px solid rgba(15,23,42,.06);background:rgba(255,255,255,.68);border-radius:12px;color:#475569;font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.collapse-btn:active{transform:scale(.96)}
.tone-peach .tdl-section-head{background:#fff4ee}
.tone-green .tdl-section-head{background:#eef9f1}
.tone-blue .tdl-section-head{background:#eef6ff}
.tone-purple .tdl-section-head{background:#f5efff}
.tone-yellow .tdl-section-head{background:#fff9df}
.tone-pink .tdl-section-head{background:#fff0f4}
.tdl-section-body{background:#fff}
.tdl-add-row{background:#fff;color:#2563eb}

/* TDL recurring rows: date on left, status on right */
.recurring{padding:11px 10px}
.rec-title-actions{display:flex;align-items:center;gap:4px}
.round-list{padding:4px 7px}
.round-row{grid-template-columns:minmax(0,1fr) 36px 88px;gap:7px;padding:7px 0}
.round-date-btn{border:0;background:transparent;text-align:left;color:#172033;font-weight:900;font-size:12px;padding:7px 6px;border-radius:10px;min-width:0}
.round-date-btn span{color:#64748b;font-size:11px}
.round-date-btn:active{background:#eaf2ff}.round-main{min-width:0}.round-note-preview{display:block;color:#8a6814;font-size:11px;line-height:1.35;margin:1px 6px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Calendar weekend visibility */
.weekend-label{color:#dc5965!important;font-weight:900}
.weekend-day{background:#fff1f3!important;color:#c84555!important;border-color:#f7d3d8!important}
.weekend-day .marks{color:#8a5560}
.day.selected.weekend-day{outline-color:#ef7180}

@media(max-width:380px){
  .easy-task,.tdl-task{grid-template-columns:minmax(0,1fr) 34px 80px 22px;gap:5px}
  .round-row{grid-template-columns:minmax(0,1fr) 34px 80px;gap:5px}
  .status-front{min-width:76px;font-size:10px}
  .collapse-btn{width:36px;height:36px}
}

/* V6: keep V2/V5 layout, add polished collapse controls to Today + TDL */
.section.purple .section-head{background:#f5efff}
.section.yellow .section-head{background:#fff9df}
.section.pink .section-head{background:#fff0f4}
.section-head-actions{display:flex;align-items:center;gap:8px;flex:none}
.daily-section-body{background:#fff}
.daily-subheading{padding:9px 12px 7px;border-top:1px solid var(--line);background:#fafbfc;color:#5b6472;font-size:11px;font-weight:900;letter-spacing:.01em}

.collapse-btn{
  width:36px;height:36px;padding:0;border-radius:12px;
  border:1px solid rgba(71,85,105,.12);
  background:rgba(255,255,255,.78);
  color:#536176;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(30,41,59,.04);
  transition:background .18s ease,border-color .18s ease,transform .12s ease;
}
.collapse-btn:hover{background:#fff;border-color:rgba(37,99,235,.18)}
.collapse-btn:active{transform:scale(.95)}
.chevron{
  width:9px;height:9px;display:block;
  border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg) translate(-1px,-1px);
  transform-origin:center;
  transition:transform .2s ease;
}
.collapse-btn[aria-expanded="true"] .chevron{transform:rotate(225deg) translate(-1px,-1px)}

/* Keep the TDL header soft and compact while giving the chevron breathing room. */
.tdl-section-head{min-height:56px}
.tdl-head-actions{gap:9px}

@media(max-width:380px){
  .section-head{padding:11px 10px 11px 12px}
  .section-head-actions{gap:5px}
  .collapse-btn{width:34px;height:34px;border-radius:11px}
  .daily-subheading{padding-left:10px}
}
.holiday-banner{background:#fff1f3;border:1px solid #ffd4da;color:#b9475b;border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.holiday-banner strong{font-size:16px}.holiday-banner small{color:#8a6570}.holiday-day:not(.weekend-day){background:#fff6f7!important;color:#c75161!important;border-color:#ffd7dd!important}


/* V8 Desktop: Chrome on one work computer is the primary experience. */
.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.backup-note{font-size:12px;line-height:1.55;color:#64748b;background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.settings-grid{display:grid;gap:12px}

@media(min-width:900px){
  body{background:linear-gradient(180deg,#eef4fb 0,#f8fafc 300px);min-width:900px}
  .app-shell{max-width:1280px;margin:0 auto;min-height:100vh;padding:0 28px 42px;display:grid;grid-template-columns:190px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:24px}
  .topbar{grid-column:1/-1;grid-row:1;padding:20px 8px 14px;align-items:center}
  .topbar h1{font-size:30px}
  #app{grid-column:2;grid-row:2;min-width:0;padding-bottom:20px}
  .bottom-nav{position:sticky;grid-column:1;grid-row:2;align-self:start;top:118px;left:auto;bottom:auto;transform:none;width:100%;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
  .nav-btn{display:grid;grid-template-columns:30px 1fr;align-items:center;text-align:left;gap:8px;font-size:18px;padding:11px 12px}
  .nav-btn span{display:inline;font-size:13px;margin:0;font-weight:800}
  .hero,.tdl-overview{padding:20px;border-radius:22px}
  .compact-hero h2{font-size:21px}
  .section,.tdl-section,.settings-card{border-radius:20px}
  .section-head,.tdl-section-head{padding-left:18px;padding-right:18px}
  .easy-task,.tdl-task{padding:11px 14px;grid-template-columns:minmax(0,1fr) 42px 104px 34px;gap:10px;min-height:66px}
  .round-row{grid-template-columns:minmax(0,1fr) 42px 104px;gap:10px;padding:8px 4px}
  .status-front{min-width:98px}
  .task-name,.tdl-task-body strong,.tdl-task-title strong{font-size:14px}
  .calendar-grid{gap:8px}
  .dow{font-size:12px;font-weight:800}
  .day{min-height:118px;border-radius:15px;padding:9px}
  .day .num{font-size:14px}
  .day .marks{font-size:11px;line-height:1.5}
  .calendar-head{margin:6px 0 16px}
  .calendar-head strong{font-size:18px}
  .settings-grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .backup-card{grid-column:span 2}
  .modal{align-items:center;padding:24px}
  .sheet{width:min(680px,calc(100% - 48px));border-radius:22px;padding:22px 24px;max-height:86vh;box-shadow:0 24px 70px rgba(15,23,42,.22)}
  .sheet-handle{display:none}
}

@media(max-width:899px){
  .backup-actions{grid-template-columns:1fr}
}

/* ================================
   V10 Hybrid UI • V9 + V8
   Visual refresh only — V8 data/logic stays intact.
   ================================ */
.v9-ui{
  --v9-bg:#f7f8fc;
  --v9-panel:#ffffff;
  --v9-ink:#27324a;
  --v9-muted:#8992a7;
  --v9-purple:#7567e8;
  --v9-purple-soft:#f1efff;
  --v9-blue:#5c91ea;
  --v9-blue-soft:#edf5ff;
  --v9-mint:#4db99d;
  --v9-mint-soft:#ecf8f4;
  --v9-peach:#eea45d;
  --v9-peach-soft:#fff5e9;
  --v9-rose:#e8758f;
  --v9-rose-soft:#fff0f4;
  --v9-line:#e9edf5;
  --v9-shadow:0 10px 32px rgba(75,86,120,.08);
  background:linear-gradient(135deg,#faf9ff 0%,#f6f9ff 45%,#f8fbfa 100%);
  color:var(--v9-ink);
}
.v9-ui .app-shell{
  max-width:1500px;
  min-height:100vh;
  margin:0 auto;
  padding:18px;
  display:grid;
  grid-template-columns:190px minmax(0,1fr);
  gap:18px;
}
.v9-ui .sidebar{
  min-height:calc(100vh - 36px);
  position:sticky;
  top:18px;
  align-self:start;
  background:rgba(255,255,255,.9);
  border:1px solid rgba(229,233,244,.95);
  border-radius:24px;
  box-shadow:var(--v9-shadow);
  display:flex;
  flex-direction:column;
  padding:18px 12px 14px;
  backdrop-filter:blur(16px);
}
.v9-ui .sidebar-brand{display:flex;align-items:center;gap:11px;padding:3px 8px 20px;border-bottom:1px solid var(--v9-line)}
.v9-ui .brand-mark{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#8b7ff0,#6f63df);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 8px 18px rgba(117,103,232,.25)}
.v9-ui .brand-copy{display:grid;gap:2px;min-width:0}.v9-ui .brand-copy strong{font-size:14px}.v9-ui .brand-copy small{font-size:10px;color:var(--v9-muted)}
.v9-ui .bottom-nav{position:static;left:auto;bottom:auto;transform:none;width:auto;display:flex;flex-direction:column;gap:7px;background:transparent;border:0;padding:18px 0 0;backdrop-filter:none;z-index:auto}
.v9-ui .nav-btn{border:0;background:transparent;border-radius:14px;padding:11px 12px;color:#788298;font-size:14px;display:grid;grid-template-columns:28px 1fr;gap:7px;align-items:center;text-align:left;transition:.18s ease}
.v9-ui .nav-btn span{display:inline;margin:0;font-size:13px;font-weight:800}.v9-ui .nav-btn .nav-icon{font-size:17px;font-weight:700;color:#7d87a0;text-align:center}
.v9-ui .nav-btn:hover{background:#f7f7fc;color:var(--v9-ink)}
.v9-ui .nav-btn.active{background:linear-gradient(90deg,#f1efff,#f7f5ff);color:#6658dc;box-shadow:inset 3px 0 0 #8375eb}.v9-ui .nav-btn.active .nav-icon{color:#6658dc}
.v9-ui .sidebar-foot{margin-top:auto;border-top:1px solid var(--v9-line);padding:16px 7px 3px;display:flex;align-items:center;gap:9px}.v9-ui .sidebar-foot>div:last-child{display:grid;gap:1px}.v9-ui .sidebar-foot strong{font-size:12px}.v9-ui .sidebar-foot small{font-size:10px;color:var(--v9-muted)}
.v9-ui .profile-dot{width:32px;height:32px;border-radius:50%;background:#f0efff;color:#6a5dde;display:grid!important;place-items:center;font-weight:900;font-size:12px}

  <script type="module">

function parseDateKey(dateKey){
  const [y,m,d]=String(dateKey).split('-').map(Number);
  return new Date(y,m-1,d);
}
function formatDateKey(date){
  return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
}
function isWorkingDate(dateKey, blockedDates=[]){
  const date=parseDateKey(dateKey),day=date.getDay(),blocked=new Set(blockedDates);
  return day!==0 && day!==6 && !blocked.has(dateKey);
}
function nextWorkingDate(dateKey, blockedDates=[]){
  let date=parseDateKey(dateKey),key=formatDateKey(date);
  while(!isWorkingDate(key,blockedDates)){
    date.setDate(date.getDate()+1);
    key=formatDateKey(date);
  }
  return key;
}
function lastCalendarDateKey(y,m){
  return formatDateKey(new Date(y,m+1,0));
}
function roundPlannedDatesForTemplate(tpl,y,m){
  if(tpl?.roundRule?.type==='monthEnd')return [lastCalendarDateKey(y,m)];
  if(tpl?.roundRule?.type==='day'){
    const maxDay=new Date(y,m+1,0).getDate();
    const day=Math.max(1,Math.min(maxDay,Number(tpl.roundRule.day)||1));
    return [formatDateKey(new Date(y,m,day))];
  }
  if(Array.isArray(tpl?.roundDays)&&tpl.roundDays.length){
    const maxDay=new Date(y,m+1,0).getDate();
    return tpl.roundDays.map(value=>{
      const day=Math.max(1,Math.min(maxDay,Number(value)||1));
      return formatDateKey(new Date(y,m,day));
    });
  }
  return [];
}
function rebuildTemplateInstanceRounds(item,tpl,y,m,blockedDates=[]){
  const previous=Array.isArray(item?.rounds)?item.rounds:[];
  const plannedDates=roundPlannedDatesForTemplate(tpl,y,m);
  const used=new Set();
  const rounds=plannedDates.map((plannedDate,index)=>{
    let oldIndex=previous.findIndex((r,i)=>!used.has(i)&&(r.plannedDate||r.date)===plannedDate);
    if(oldIndex<0 && previous[index] && !used.has(index))oldIndex=index;
    const old=oldIndex>=0?previous[oldIndex]:null;
    if(oldIndex>=0)used.add(oldIndex);
    const newDate=nextWorkingDate(plannedDate,blockedDates);
    const taskStates=old?.taskStates&&typeof old.taskStates==='object'
      ? Object.fromEntries(Object.entries(old.taskStates).map(([key,value])=>{
          const state={...value};
          if(!state.movedFrom && (!state.date || state.date===old.date)){
            state.plannedDate=plannedDate;
            state.date=newDate;
          }
          return [key,state];
        }))
      : undefined;
    return {
      plannedDate,
      date:newDate,
      status:old?.status||'todo',
      note:old?.note||'',
      ...(old?.taskBaseStatus!==undefined?{taskBaseStatus:old.taskBaseStatus}:{}),
      ...(old?.taskBaseNote!==undefined?{taskBaseNote:old.taskBaseNote}:{}),
      ...(taskStates?{taskStates}:{})

  return {...item,roundRule:tpl?.roundRule,rounds,status:undefined};

function applyRecurringRuleToTemplateState(targetState,templateId,rule,blockedDates=[]){
  const tpl=(targetState?.tdlTemplates||[]).find(t=>t.id===templateId);
  if(!tpl)return [];
  tpl.roundRule={...rule};
  delete tpl.roundDays;
  const affected=[];
  for(const [key,items] of Object.entries(targetState.tdl||{})){
    const match=/^(\d{4})-(\d{2})$/.exec(key);
    if(!match||!Array.isArray(items))continue;
    const y=Number(match[1]),m=Number(match[2])-1;
    let changed=false;
    for(let i=0;i<items.length;i++){
      if(items[i]?.templateId!==templateId)continue;
      items[i]=rebuildTemplateInstanceRounds(items[i],tpl,y,m,blockedDates);
      changed=true;
    }
    if(changed)affected.push(key);
  }

}
function normalizeScheduledRounds(items=[], blockedDates=[]){

            return [key,{...value,plannedDate:taskPlanned,date:nextWorkingDate(taskPlanned,blockedDates)}];

function bangkokDateKey(now=new Date()){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));return `${parts.year}-${parts.month}-${parts.day}`}

function deriveRoundStatus(rounds=[]){
  if(!rounds.length) return 'todo';
  const statuses=rounds.map(r=>r.status);
  if(statuses.every(s=>s==='done')) return 'done';
  if(statuses.every(s=>s==='todo')) return 'todo';
  return 'waiting';
}

function dailySpecsForItem(item){
  return Array.isArray(item?.dailyTasks)&&item.dailyTasks.length
    ? item.dailyTasks
    : [{key:item?.id,cat:item?.dailyCat||'incoming',title:item?.title,subheading:item?.subheading||'',sub:item?.subtitle||''}];
}
function dailySpecKey(item,spec){
  return spec?.key||`${item?.id}:${spec?.cat||''}:${spec?.title||item?.title||''}`;
}
function roundTaskSnapshot(item,round,taskKey){
  const stored=round?.taskStates?.[taskKey];
  const baseDate=round?.date||'';
  const basePlanned=round?.plannedDate||baseDate;
  const baseStatus=round?.taskBaseStatus!==undefined?round.taskBaseStatus:(round?.status||'todo');
  const baseNote=round?.taskBaseNote!==undefined?round.taskBaseNote:(round?.note||'');
  return {
    plannedDate:stored?.plannedDate||basePlanned,
    date:stored?.date||baseDate,
    status:stored?.status||baseStatus,
    note:stored?.note!==undefined?stored.note:baseNote,
    movedFrom:stored?.movedFrom||''
  };
}
function ensureRoundTaskStates(item,round){
  if(!round.taskStates||typeof round.taskStates!=='object'){
    round.taskBaseStatus=round.status||'todo';
    round.taskBaseNote=round.note||'';
    round.taskStates={};
  }else{
    if(round.taskBaseStatus===undefined)round.taskBaseStatus=round.status||'todo';
    if(round.taskBaseNote===undefined)round.taskBaseNote=round.note||'';
  }
  for(const spec of dailySpecsForItem(item)){
    const key=dailySpecKey(item,spec);
    if(!round.taskStates[key])round.taskStates[key]=roundTaskSnapshot(item,round,key);
  }
  return round.taskStates;
}
function refreshRoundTaskAggregate(item,round){
  const statuses=dailySpecsForItem(item).map(spec=>roundTaskSnapshot(item,round,dailySpecKey(item,spec)).status);
  if(statuses.length&&statuses.every(s=>s==='done'))round.status='done';
  else if(statuses.length&&statuses.every(s=>s==='todo'))round.status='todo';
  else round.status='waiting';
  return round.status;
}
function setRoundTaskState(item,round,taskKey,patch={}){
  ensureRoundTaskStates(item,round);
  round.taskStates[taskKey]={...round.taskStates[taskKey],...patch};
  refreshRoundTaskAggregate(item,round);
  return round.taskStates[taskKey];
}
function taskRefFor(item,round,taskKey){
  return {itemId:item.id,roundDate:round.date,roundPlannedDate:round.plannedDate||round.date,taskKey};
}
function locateTaskRefInState(targetState,ref){
  if(!ref||typeof ref!=='object')return null;
  for(const [month,items] of Object.entries(targetState?.tdl||{})){
    if(!Array.isArray(items))continue;
    const item=items.find(x=>x.id===ref.itemId);
    if(!item)continue;
    const round=(item.rounds||[]).find(r=>
      (ref.roundDate&&r.date===ref.roundDate) ||
      (ref.roundPlannedDate&&(r.plannedDate||r.date)===ref.roundPlannedDate)
    );
    if(round)return {month,item,round,taskKey:ref.taskKey};
  }
  return null;
}
function roundTaskMoveSummaries(item,round){
  if(!round?.taskStates)return [];
  return dailySpecsForItem(item).map(spec=>{
    const key=dailySpecKey(item,spec),state=roundTaskSnapshot(item,round,key);
    return state.date&&state.date!==round.date?{key,title:spec.title||item.title,date:state.date,status:state.status}:null;
  }).filter(Boolean);
}

function flattenTDL(items=[]){
  return items.flatMap(item=>{

      return item.rounds.map(round=>({

        section:item.section,
        note:round.note||item.note||'',
        date:round.date,
        status:round.status,
        recurring:true
      }));
    }
    return [{...item}];
  });
}

function summarizeTDL(items=[]){

function pendingTDLItems(items=[]){

function nextStatus(status){
  const order=['todo','waiting','done'];
  const i=order.indexOf(status);
  return order[(i<0?0:i+1)%order.length];
}

function moveRoundDate(rounds=[],fromDate,toDate){
  return rounds.map(round=>round.date===fromDate?{...round,date:toDate}:{...round});
}

function scheduledTaskId(itemId,date){

function collectDailyScheduleEntries(items=[],date){
  const byKey=new Map();
  for(const item of items){
    if(item.syncToToday===false || !Array.isArray(item.rounds)) continue;
    const specs=dailySpecsForItem(item);
    for(const round of item.rounds){
      for(const spec of specs){
        const key=dailySpecKey(item,spec);
        const taskState=roundTaskSnapshot(item,round,key);
        if(taskState.date!==date)continue;
        if(!byKey.has(key)) byKey.set(key,{...spec,key,refs:[],_statuses:[],_notes:[],_movedFroms:[]});
        const entry=byKey.get(key);
        entry.refs.push(taskRefFor(item,round,key));
        entry._statuses.push(taskState.status||'todo');
        entry._notes.push(taskState.note||'');
        entry._movedFroms.push(taskState.movedFrom||'');
      }
    }
  }
  return [...byKey.values()].map(({_statuses,_notes,_movedFroms,...entry})=>({
    ...entry,
    status:deriveRoundStatus(_statuses.map(status=>({status}))),
    note:_notes.find(Boolean)||'',
    movedFrom:_movedFroms.find(Boolean)||''
  }));
}

function rescheduleTodayTaskState(targetState,fromKey,taskId,requestedKey,blockedDates=[]){
  if(!targetState||!requestedKey)return {ok:false,reason:'invalid'};
  targetState.days=targetState.days||{};
  targetState.dayCategories=targetState.dayCategories||{};
  targetState.tdl=targetState.tdl||{};
  const sourceList=Array.isArray(targetState.days[fromKey])?targetState.days[fromKey]:[];
  const task=sourceList.find(t=>t.id===taskId);
  if(!task)return {ok:false,reason:'not-found'};
  const effectiveDate=nextWorkingDate(requestedKey,blockedDates);

  if(task.source==='tdl'){
    const refs=Array.isArray(task.tdlRefs)&&task.tdlRefs.length?task.tdlRefs:[task.tdlRef].filter(Boolean);
    const structured=refs.map(ref=>locateTaskRefInState(targetState,ref)).filter(Boolean);
    if(structured.length){
      for(const located of structured){
        const {item,round,taskKey}=located;
        ensureRoundTaskStates(item,round);
        const collision=(item.rounds||[]).some(other=>{
          if(other===round)return false;
          return roundTaskSnapshot(item,other,taskKey).date===effectiveDate;
        });
        if(collision)return {ok:false,reason:'duplicate-date',effectiveDate};
      }
      for(const {item,round,taskKey} of structured){
        const current=roundTaskSnapshot(item,round,taskKey);
        setRoundTaskState(item,round,taskKey,{
          plannedDate:requestedKey,
          date:effectiveDate,
          movedFrom:current.movedFrom||fromKey
        });
      }
      return {ok:true,kind:'tdl',effectiveDate,sourceMonths:[...new Set(structured.map(x=>x.month))]};
    }

    // Legacy reference fallback for data created before per-task scheduling.
    const located=[];
    for(const ref of refs){
      if(typeof ref!=='string')continue;
      const idx=String(ref).lastIndexOf('::');
      if(idx<0)continue;
      const itemId=String(ref).slice(0,idx),oldDate=String(ref).slice(idx+2);
      let found=null;
      for(const [month,items] of Object.entries(targetState.tdl)){
        if(!Array.isArray(items))continue;
        const item=items.find(x=>x.id===itemId);
        const round=item?.rounds?.find(r=>r.date===oldDate);
        if(round){found={month,item,round,oldDate};break;}
      }
      if(found)located.push(found);
    }
    if(!located.length)return {ok:false,reason:'tdl-round-not-found'};
    for(const {item,round} of located){
      if(item.rounds?.some(r=>r!==round&&r.date===effectiveDate))return {ok:false,reason:'duplicate-date',effectiveDate};
    }
    for(const {round} of located){
      round.movedFrom=round.movedFrom||fromKey;
      round.plannedDate=requestedKey;
      round.date=effectiveDate;
    }
    return {ok:true,kind:'tdl',effectiveDate,sourceMonths:[...new Set(located.map(x=>x.month))]};
  }

  targetState.days[fromKey]=sourceList.filter(t=>t.id!==taskId);
  const moved={...task,movedFrom:task.movedFrom||fromKey};
  (targetState.days[effectiveDate]??=[]).push(moved);
  const sourceCategory=(targetState.dayCategories[fromKey]||[]).find(c=>c.id===task.cat);
  if(sourceCategory){
    const targetCategories=targetState.dayCategories[effectiveDate]??=[];
    if(!targetCategories.some(c=>c.id===sourceCategory.id))targetCategories.push({...sourceCategory});
  }
  return {ok:true,kind:'manual',effectiveDate,sourceMonths:[]};
}

function moveLinkedRoundDate(items=[],itemId,fromDate,toDate){
  const target=items.find(item=>item.id===itemId);
  if(!target) return items.map(item=>({...item,rounds:Array.isArray(item.rounds)?item.rounds.map(r=>({...r})):item.rounds}));
  const group=target.scheduleGroup;
  return items.map(item=>{
    const linked=item.id===itemId || (group && item.scheduleGroup===group);
    if(!linked || !Array.isArray(item.rounds)) return {...item,rounds:Array.isArray(item.rounds)?item.rounds.map(r=>({...r})):item.rounds};
    return {...item,rounds:moveRoundDate(item.rounds,fromDate,toDate)};
  });
}

function parseBackupEnvelope(text){
  let payload;
  try{ payload=JSON.parse(text); }
  catch{ throw new Error('ไฟล์สำรองไม่ถูกต้อง'); }
  if(!payload || payload.format!=='benz-daily-work-backup' || payload.version!==1 || !payload.state || typeof payload.state!=='object' || Array.isArray(payload.state)){
    throw new Error('ไฟล์สำรองไม่ถูกต้อง');
  }
  return payload.state;
}

function defaultEvents(now){
  return {};
}
function defaultState(){
  const now=new Date(); const today=fmtKey(now);
  return {
    selected:today,view:'today',days:{},events:defaultEvents(now),tdl:{},tdlFilter:'all',todayFilter:'all',
    dailyCategories:seedDailyCategories(),dailyTemplates:seedDailyTemplates(),dayCategories:{},
    tdlSections:seedTDLSections(),monthTdlSections:{},tdlCollapsed:{},dailyCollapsed:{},tdlTemplates:[]
  };
}
function normalizeState(raw){
  const base=defaultState(),s=raw&&typeof raw==='object'?raw:{};
  return {
    ...base,...s,
    days:s.days||{},events:s.events||base.events,tdl:s.tdl||{},
    dailyCategories:Array.isArray(s.dailyCategories)?s.dailyCategories:base.dailyCategories,
    dailyTemplates:Array.isArray(s.dailyTemplates)?s.dailyTemplates:base.dailyTemplates,
    dayCategories:s.dayCategories||{},
    tdlSections:Array.isArray(s.tdlSections)?s.tdlSections:base.tdlSections,
    monthTdlSections:s.monthTdlSections||{},tdlCollapsed:s.tdlCollapsed||{},dailyCollapsed:s.dailyCollapsed||{},
    tdlTemplates:Array.isArray(s.tdlTemplates)?s.tdlTemplates:[]
  };
}
let state=(()=>{try{return normalizeState(JSON.parse(localStorage.getItem(STORAGE)))}catch{return defaultState()}})();
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function selectedDate(){return dateFromKey(state.selected)}
function currentMonthKey(){return monthKey(selectedDate())}
function holidayDates(){
  return Object.entries(state.events||{}).filter(([,events])=>events?.some(e=>e.type==='holiday')).map(([key])=>key);
}
function isWorkingDayKey(key){return isWorkingDate(key,holidayDates())}
function normalizeTdlSchedules(items){return normalizeScheduledRounds(items,holidayDates())}
function monthShiftedDate(d,delta){return new Date(d.getFullYear(),d.getMonth()+delta,1)}
function syncRelevantScheduleMonths(d=selectedDate()){
  syncSchedulesForMonth(monthShiftedDate(d,-1));
  syncSchedulesForMonth(d);
}
function rebuildSchedulesForHolidayChange(key){

  syncSchedulesForMonth(monthShiftedDate(d,-1));
  syncSchedulesForMonth(d);
}

function categoriesFor(key=state.selected){return [...state.dailyCategories,...(state.dayCategories[key]||[])]}
function cloneTemplate(t,key){return {...t,id:`${t.id}@${key}`,templateId:t.id,status:'todo',note:'',special:!!t.special}}
function tasksFor(key){
  if(!state.days[key])state.days[key]=[];
  const list=state.days[key];
  if(!isWorkingDayKey(key))return list.filter(t=>t.allowOnNonWorking===true);
  for(const tpl of state.dailyTemplates){if(!list.some(x=>x.templateId===tpl.id))list.push(cloneTemplate(tpl,key));}
  return list;
}
function addPersistentTdlTemplates(items,y,m,key){
  for(const tpl of state.tdlTemplates){
    if(items.some(i=>i.templateId===tpl.id))continue;
    let item={...tpl,id:`${tpl.id}@${key}`,templateId:tpl.id,status:'todo',note:tpl.note||''};
    const plannedDates=roundPlannedDatesForTemplate(tpl,y,m);
    if(plannedDates.length)item={...item,rounds:plannedDates.map(date=>({plannedDate:date,date,status:'todo',note:''})),status:undefined};
    items.push(item);
  }
}
function tdlForDate(d){
  const key=monthKey(d);
  if(!state.tdl[key])state.tdl[key]=seedTDL(d.getFullYear(),d.getMonth());
  addPersistentTdlTemplates(state.tdl[key],d.getFullYear(),d.getMonth(),key);
  state.tdl[key]=normalizeTdlSchedules(state.tdl[key]);
  return state.tdl[key];
}
function tdlForSelected(){return tdlForDate(selectedDate())}
function tdlSectionsFor(d=selectedDate()){
  const key=monthKey(d); return [...state.tdlSections,...(state.monthTdlSections[key]||[])];
}
function collapseKey(sectionId,d=selectedDate()){return `${monthKey(d)}::${sectionId}`}
function dailyCollapseKey(sectionId,key=state.selected){return `${key}::${sectionId}`}

function scheduledCatForSection(section){return section==='incoming'?'incoming':section==='reconcile'?'reconcile':'docs'}
function syncSchedulesForMonth(d=selectedDate()){
  const sourceMonth=monthKey(d),items=tdlForDate(d);
  for(const key of Object.keys(state.days)){
    state.days[key]=state.days[key].filter(t=>!(t.source==='tdl'&&t.tdlMonth===sourceMonth));
  }
  for(const key of Object.keys(state.events)){
    state.events[key]=state.events[key].filter(e=>!(e.source==='tdl'&&e.tdlMonth===sourceMonth));
    if(!state.events[key].length)delete state.events[key];
  }
  const dates=[...new Set(items.flatMap(item=>(item.rounds||[]).flatMap(round=>[
    round.date,
    ...Object.values(round.taskStates||{}).map(taskState=>taskState?.date)
  ])).filter(Boolean))].sort();
  for(const key of dates){
    if(!isWorkingDayKey(key))continue;
    const entries=collectDailyScheduleEntries(items,key);
    for(const entry of entries){
      const day=tasksFor(key);
      day.push({
        id:scheduledTaskId(entry.key,key),cat:entry.cat||'incoming',title:entry.title,
        sub:entry.sub||`งานตามรอบจาก TDL • ${thaiShortDate(key)}`,subheading:entry.subheading||'',
        status:entry.status,note:entry.note||'',movedFrom:entry.movedFrom||'',special:true,source:'tdl',tdlMonth:sourceMonth,tdlRefs:entry.refs
      });
      (state.events[key]??=[]).push({type:'special',title:entry.title,source:'tdl',tdlMonth:sourceMonth,itemId:entry.key});
    }
  }
}

function taskHtml(t){return `<div class="task easy-task ${t.status==='done'?'is-done':''}"><div class="task-main"><div class="task-name">${taskLabel(t)}</div>${t.sub?`<div class="task-sub">${escapeHtml(t.sub)}</div>`:''}${t.movedFrom?`<div class="task-move-preview">↪ เลื่อนมาจาก ${thaiShortDate(t.movedFrom)}</div>`:''}${t.note?`<div class="task-note-preview">📝 ${escapeHtml(t.note)}</div>`:''}</div><button class="icon-btn note-icon ${t.note?'has-note':''}" data-note="${t.id}" aria-label="หมายเหตุ">📝</button><button class="status status-front ${t.status}" data-status="${t.id}"><span class="status-dot"></span><span>${STATUS[t.status]}</span></button><button class="more" data-more="${t.id}">⋮</button></div>`}
function getTask(id){return tasksFor(state.selected).find(t=>t.id===id)}
function locateTDL(ref,d=selectedDate()){
  const preferred=tdlForDate(d);
  if(ref.includes('::')){
    const idx=ref.lastIndexOf('::'),id=ref.slice(0,idx),date=ref.slice(idx+2);
    let item=preferred.find(x=>x.id===id),round=item?.rounds?.find(r=>r.date===date);
    if(round)return {item,round};
    for(const items of Object.values(state.tdl)){
      item=items.find(x=>x.id===id);
      round=item?.rounds?.find(r=>r.date===date);
      if(round)return {item,round};
    }
    return {item:null,round:null};
  }
  return {item:preferred.find(x=>x.id===ref),round:null};
}
function updateLinkedTDLRounds(refs,status,note){
  for(const ref of refs||[]){
    if(ref&&typeof ref==='object'){
      const located=locateTaskRefInState(state,ref);
      if(!located)continue;
      const patch={};
      if(status)patch.status=status;
      if(note!==undefined)patch.note=note;
      setRoundTaskState(located.item,located.round,located.taskKey,patch);
      continue;
    }
    const {round}=locateTDL(ref);
    if(!round)continue;
    if(status)round.status=status;
    if(note!==undefined)round.note=note;
  }
}
function cycleDailyStatus(id){
  const t=getTask(id);if(!t)return;t.status=nextStatus(t.status);
  if(t.source==='tdl')updateLinkedTDLRounds(t.tdlRefs||[t.tdlRef].filter(Boolean),t.status);
  save();renderToday();
}

function renderCalendar(){

  for(let i=0;i<start;i++)html+='<div></div>';
  for(let n=1;n<=days;n++){

function cycleTDLStatus(ref){
  const {item,round}=locateTDL(ref),target=round||item;if(!target)return;

    round.taskBaseStatus=next;
    for(const key of Object.keys(round.taskStates))round.taskStates[key]={...round.taskStates[key],status:next};
    round.status=next;
    syncSchedulesForMonth(selectedDate());
  }else target.status=next;

}

function tdlTaskMenu(id){
  const item=tdlForSelected().find(x=>x.id===id);if(!item)return;openModal(`<h3>แก้ไขงาน TDL</h3><div class="field"><label>ชื่องาน</label><input id="tdlMenuTitle" value="${escapeHtml(item.title)}"></div><div class="field"><label>รายละเอียด</label><input id="tdlMenuSub" value="${escapeHtml(item.subtitle||'')}"></div>${item.rounds?.length?'<button class="ghost big-btn" id="addRound">＋ เพิ่มรอบวันที่</button>':''}<div class="row"><button class="ghost danger" id="deleteTdlItem">ลบงาน</button><button class="primary" id="saveTdlItem">บันทึก</button></div>`);
  document.querySelector('#saveTdlItem').onclick=()=>{item.title=document.querySelector('#tdlMenuTitle').value.trim()||item.title;item.subtitle=document.querySelector('#tdlMenuSub').value.trim();syncSchedulesForMonth(selectedDate());save();closeModal();renderTDL()};
  document.querySelector('#deleteTdlItem').onclick=()=>{const arr=tdlForSelected(),idx=arr.findIndex(x=>x.id===id);if(idx>=0)arr.splice(idx,1);syncSchedulesForMonth(selectedDate());save();closeModal();renderTDL()};
  if(document.querySelector('#addRound'))document.querySelector('#addRound').onclick=()=>addTDLRound(item.id);
}

function addTDLRound(itemId){
  const item=tdlForSelected().find(x=>x.id===itemId);if(!item)return;
  openModal(`<h3>＋ เพิ่มรอบวันที่</h3><div class="field"><label>${escapeHtml(item.title)}</label><input id="newRoundDate" type="date" value="${state.selected}"></div><div class="field"><label>หมายเหตุ</label><textarea id="newRoundNote"></textarea></div><button class="primary big-btn" id="saveNewRound">เพิ่มรอบ</button>`);
  document.querySelector('#saveNewRound').onclick=()=>{
    const date=document.querySelector('#newRoundDate').value;if(!date)return;
    const effectiveDate=nextWorkingDate(date,holidayDates()),items=tdlForSelected(),group=item.scheduleGroup,linked=group?items.filter(x=>x.scheduleGroup===group):[item];
    if(linked.some(x=>x.rounds?.some(r=>r.date===effectiveDate))){alert('วันที่ทำงานจริงนี้มีรอบอยู่แล้ว');return}
    for(const target of linked){
      target.rounds=target.rounds||[];
      target.rounds.push({plannedDate:date,date:effectiveDate,status:'todo',note:target.id===item.id?document.querySelector('#newRoundNote').value.trim():''});
      target.rounds.sort((a,b)=>a.date.localeCompare(b.date));
    }
    syncSchedulesForMonth(selectedDate());save();closeModal();renderTDL();
  };
}

function addTDLTask(sectionId){
  openModal(`<h3>＋ เพิ่มงานใน TDL</h3><div class="field"><label>ชื่องาน</label><input id="tdlNewTitle" placeholder="ชื่องาน"></div><div class="field"><label>รายละเอียด</label><input id="tdlNewSub" placeholder="เช่น งานปลายเดือน"></div><div class="field"><label>ประเภทงาน</label><select id="tdlNewType"><option value="normal">งานทั่วไปของเดือน</option><option value="round">งานตามรอบ / มีวันที่</option></select></div><div class="field"><label>ใช้เมื่อไหร่</label><select id="tdlNewScope"><option value="month">เฉพาะเดือนนี้</option><option value="all">ใช้ทุกเดือน</option></select></div><div class="field" id="roundRepeatWrap" hidden><label>รอบประจำเดือน</label><select id="tdlRoundRule"><option value="day">วันที่เดียวกันทุกเดือน</option><option value="monthEnd">สิ้นเดือน</option></select><small class="field-help">สิ้นเดือนจะเลือกวันสุดท้ายของแต่ละเดือนให้อัตโนมัติ</small></div><div class="field" id="firstRoundWrap" hidden><label>วันที่รอบแรก</label><input id="tdlFirstRound" type="date" value="${state.selected}"></div><div class="field"><label>หมายเหตุ</label><textarea id="tdlNewNote"></textarea></div><button class="primary big-btn" id="saveNewTdl">เพิ่มงาน</button>`);
  const syncNewTaskFields=()=>{
    const type=document.querySelector('#tdlNewType').value,scope=document.querySelector('#tdlNewScope').value,rule=document.querySelector('#tdlRoundRule').value;
    const isRound=type==='round',isRecurring=isRound&&scope==='all';
    document.querySelector('#roundRepeatWrap').hidden=!isRecurring;
    document.querySelector('#firstRoundWrap').hidden=!isRound||(isRecurring&&rule==='monthEnd');
  };
  document.querySelector('#tdlNewType').onchange=syncNewTaskFields;
  document.querySelector('#tdlNewScope').onchange=syncNewTaskFields;
  document.querySelector('#tdlRoundRule').onchange=syncNewTaskFields;
  syncNewTaskFields();
  document.querySelector('#saveNewTdl').onclick=()=>{
    const title=document.querySelector('#tdlNewTitle').value.trim();if(!title)return;
    const subtitle=document.querySelector('#tdlNewSub').value.trim(),note=document.querySelector('#tdlNewNote').value.trim(),type=document.querySelector('#tdlNewType').value,scope=document.querySelector('#tdlNewScope').value,id='tdl-custom-'+Date.now();
    let item={id,section:sectionId,title,subtitle,status:'todo',note},plannedDate='';
    if(type==='round'){
      const ruleType=document.querySelector('#tdlRoundRule').value;
      if(scope==='all'&&ruleType==='monthEnd')plannedDate=lastCalendarDateKey(selectedDate().getFullYear(),selectedDate().getMonth());
      else plannedDate=document.querySelector('#tdlFirstRound').value;
      if(!plannedDate)return;
      const effectiveDate=nextWorkingDate(plannedDate,holidayDates());
      item={...item,status:undefined,rounds:[{plannedDate,date:effectiveDate,status:'todo',note}]};
    }
    if(scope==='all'){
      const tpl={id:'tdl-tpl-'+Date.now(),section:sectionId,title,subtitle,note};
      if(type==='round'){
        const ruleType=document.querySelector('#tdlRoundRule').value;
        tpl.roundRule=ruleType==='monthEnd'?{type:'monthEnd'}:{type:'day',day:dateFromKey(plannedDate).getDate()};
      }
      state.tdlTemplates.push(tpl);item.templateId=tpl.id;item.id=`${tpl.id}@${currentMonthKey()}`;
    }
    tdlForSelected().push(item);syncSchedulesForMonth(selectedDate());save();closeModal();renderTDL();
  };
}

function addTDLSection(){
  openModal(`<h3>＋ เพิ่มหัวข้อ TDL</h3><div class="field"><label>ชื่อหัวข้อ</label><input id="tdlSecTitle" placeholder="เช่น 7. งานพิเศษประจำเดือน"></div><div class="field"><label>ไอคอน</label><input id="tdlSecIcon" value="📌"></div><div class="field"><label>สีหัวข้อ</label><select id="tdlSecTone">${toneOptions('purple')}</select></div><div class="field"><label>ใช้เมื่อไหร่</label><select id="tdlSecScope"><option value="month">เฉพาะเดือนนี้</option><option value="all">ใช้ทุกเดือน</option></select></div><button class="primary big-btn" id="saveTdlSec">เพิ่มหัวข้อ</button>`);
  document.querySelector('#saveTdlSec').onclick=()=>{const title=document.querySelector('#tdlSecTitle').value.trim();if(!title)return;const sec={id:'tdl-sec-'+Date.now(),title,icon:document.querySelector('#tdlSecIcon').value.trim()||'📌',tone:document.querySelector('#tdlSecTone').value,builtin:false};if(document.querySelector('#tdlSecScope').value==='all')state.tdlSections.push(sec);else(state.monthTdlSections[currentMonthKey()]??=[]).push(sec);save();closeModal();renderTDL()};
}

function renderSettings(){app.innerHTML=`<div class="settings-grid"><section class="settings-card"><h3>🔔 แจ้งเตือนบนคอม</h3><p>Chrome สามารถแสดง Notification ที่มุมหน้าจอ Windows ได้ เมื่ออนุญาตการแจ้งเตือนให้เว็บไซต์นี้</p><div class="schedule"><span>09:00</span><span>11:00</span><span>13:30</span><span>15:30</span><span>17:00</span></div><div class="toolbar"><button class="primary" id="notifyTest">ทดสอบ Notification</button></div></section><section class="settings-card backup-card"><h3>💾 สำรอง / กู้คืนข้อมูล</h3><p>ข้อมูลหลักเก็บอยู่ใน Chrome ของคอมเครื่องนี้ แนะนำให้ดาวน์โหลดไฟล์สำรองเก็บไว้เป็นระยะ เผื่อมีการล้างข้อมูลเว็บไซต์หรือเปลี่ยนเครื่อง</p><div class="backup-actions"><button class="primary" id="exportBackup">⬇️ สำรองข้อมูล</button><button class="ghost" id="restoreBackup">⬆️ กู้คืนข้อมูล</button></div><input id="backupFileInput" type="file" accept="application/json,.json" hidden><div class="backup-note">ไฟล์สำรองจะเก็บงาน Today, TDL, Calendar, สถานะ, หมายเหตุ และวันหยุดของคุณทั้งหมด</div></section><section class="settings-card"><h3>🗂️ ข้อมูลบนเครื่องนี้</h3><p>V11.6.1 ใช้ข้อมูลชุดเดียวกับ V11.6/V11.5/V11.4/V11.3/V11.2/V10/V9/V8/V7 บนเว็บไซต์เดิม เพื่อให้ข้อมูลที่ใช้งานดีอยู่แล้วไม่หายเมื่ออัปเดตหน้าตาเป็น Desktop</p><button class="ghost danger" id="resetDemo">รีเซ็ตข้อมูลตัวอย่าง</button></section></div>`;document.querySelector('#notifyTest').onclick=testNotification;document.querySelector('#exportBackup').onclick=exportBackup;document.querySelector('#restoreBackup').onclick=()=>document.querySelector('#backupFileInput').click();document.querySelector('#backupFileInput').onchange=async e=>{await restoreBackup(e.target.files?.[0]);e.target.value=''};document.querySelector('#resetDemo').onclick=()=>{if(!confirm('รีเซ็ตข้อมูลทั้งหมดในเครื่องนี้ใช่ไหม?'))return;localStorage.removeItem(STORAGE);state=defaultState();render()}}

function exportBackup(){
  const payload=makeBackupEnvelope(state,new Date().toISOString());
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`benz-daily-work-backup-${fmtKey(new Date())}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0);
}
async function restoreBackup(file){
  if(!file)return;
  try{
    const restored=normalizeState(parseBackupEnvelope(await file.text()));
    if(!confirm('กู้คืนข้อมูลจากไฟล์นี้ใช่ไหม? ข้อมูลปัจจุบันใน Chrome จะถูกแทนที่'))return;
    state=restored;save();render();alert('กู้คืนข้อมูลเรียบร้อยแล้ว');
  }catch(err){alert(err?.message||'ไฟล์สำรองไม่ถูกต้อง')}
}
async function testNotification(){if(!('Notification'in window)){alert('เบราว์เซอร์นี้ไม่รองรับ Notification');return}let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();if(p==='granted')new Notification('Benz Daily Work',{body:`อย่าลืมทำนะ • ยังเหลือ ${pendingTasks(tasksFor(state.selected)).length} งาน`,icon:'icon.svg'});else alert('ยังไม่ได้อนุญาต Notification')}

let deferredPrompt;const installBtn=document.querySelector('#installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
render();

</script>
